naftiko: 1.0.0-alpha2
info:
  label: Userpilot API — Real-time
  description: 'Userpilot API — Real-time. 2 operations. Lead operation: Identify. Self-contained Naftiko capability covering
    one Userpilot business surface.'
  tags:
  - Userpilot
  - Real-time
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    USERPILOT_API_KEY: USERPILOT_API_KEY
capability:
  consumes:
  - type: http
    namespace: analytex-real-time
    baseUri: https://{environment}.userpilot.io
    description: Userpilot API — Real-time business capability. Self-contained, no shared references.
    resources:
    - name: v1-identify
      path: /v1/identify
      operations:
      - name: post
        method: POST
        description: Identify
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
        - name: Accept
          in: header
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: v1-users-bulk_identify
      path: /v1/users/bulk_identify
      operations:
      - name: post
        method: POST
        description: Users - Bulk Identify and Update
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Content-Type
          in: header
          type: string
        - name: Accept
          in: header
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: analytex-real-time-rest
    port: 8080
    description: REST adapter for Userpilot API — Real-time. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/identify
      name: v1-identify
      description: REST surface for v1-identify.
      operations:
      - method: POST
        name: post
        description: Identify
        call: analytex-real-time.post
        with:
          Content-Type: rest.Content-Type
          Accept: rest.Accept
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/users/bulk-identify
      name: v1-users-bulk-identify
      description: REST surface for v1-users-bulk_identify.
      operations:
      - method: POST
        name: post
        description: Users - Bulk Identify and Update
        call: analytex-real-time.post
        with:
          Content-Type: rest.Content-Type
          Accept: rest.Accept
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: analytex-real-time-mcp
    port: 9090
    transport: http
    description: MCP adapter for Userpilot API — Real-time. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: identify
      description: Identify
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: analytex-real-time.post
      with:
        Content-Type: tools.Content-Type
        Accept: tools.Accept
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: users-bulk-identify-and-update
      description: Users - Bulk Identify and Update
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: analytex-real-time.post
      with:
        Content-Type: tools.Content-Type
        Accept: tools.Accept
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
